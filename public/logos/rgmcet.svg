<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="gearShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Shield Outer Rim -->
  <path d="M 52,14 C 74,32 100,28 120,24 C 140,28 166,32 188,14 C 196,80 188,126 120,154 C 52,126 44,80 52,14 Z" 
        fill="url(#goldBorderGrad)" stroke="#111827" stroke-width="3" stroke-linejoin="round" />

  <!-- Inner Shield Body -->
  <path d="M 58,22 C 77,36 102,33 120,30 C 138,33 163,36 182,22 C 188,78 180,120 120,146 C 60,120 52,78 58,22 Z" 
        fill="url(#shieldGrad)" stroke="#111827" stroke-width="2" />

  <!-- Blue Gear / Cog Wheel -->
  <g transform="translate(120, 84)" filter="url(#gearShadow)">
    <!-- Cog teeth (12 teeth) -->
    <path d="
      M -10,-48 L 10,-48 L 8,-39 L 19,-36 L 28,-42 L 42,-28 L 36,-19 L 39,-8 L 48,-10 L 48,10 L 39,8 L 36,19 L 42,28 L 28,42 L 19,36 L 8,39 L 10,48 L -10,48 L -8,39 L -19,36 L -28,42 L -42,28 L -36,19 L -39,8 L -48,10 L -48,-10 L -39,-8 L -36,-19 L -42,-28 L -28,-42 L -19,-36 L -8,-39 Z
    " fill="#1d4ed8" stroke="#0f172a" stroke-width="2.5" />

    <!-- Center Yellow Disc -->
    <circle cx="0" cy="0" r="30" fill="#fde047" stroke="#111827" stroke-width="2.5" />
    <circle cx="0" cy="0" r="26" fill="none" stroke="#ea580c" stroke-width="1.5" />

    <!-- Stylized Red 'R' / Lightning Bolt Arrow -->
    <path d="M -16,-20 L -8,-20 L -8,-2 L 4,-2 C 12,-2 14,-8 14,-12 C 14,-17 9,-20 2,-20 L -16,-20 Z" fill="#dc2626" />
    <path d="M -16,-20 L -16,18 L -8,18 L -8,2 L 0,2 L 10,18 L 20,18 L 8,0 C 16,-2 22,-8 22,-14 C 22,-22 14,-26 2,-26 L -16,-26 Z" fill="#dc2626" stroke="#991b1b" stroke-width="0.5" />
    <polygon points="-24,-14 26,10 6,10 24,18 -8,4 8,4" fill="#ef4444" opacity="0.9" />
  </g>

  <!-- Computer Terminal Monitor at base of gear -->
  <g transform="translate(120, 112)">
    <!-- Monitor Bezel -->
    <rect x="-16" y="-12" width="32" height="24" rx="3" fill="#cbd5e1" stroke="#111827" stroke-width="2" />
    <!-- Screen -->
    <rect x="-12" y="-9" width="24" height="17" rx="1.5" fill="#1e293b" stroke="#0f172a" stroke-width="1" />
    <!-- Screen prompt line -->
    <line x1="-9" y1="-3" x2="3" y2="-3" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" />
    <!-- Monitor Stand -->
    <rect x="-5" y="12" width="10" height="4" fill="#94a3b8" stroke="#111827" stroke-width="1.5" />
    <rect x="-14" y="16" width="28" height="3" rx="1" fill="#cbd5e1" stroke="#111827" stroke-width="1.5" />
  </g>

  <!-- Banner Ribbon (EDUCATION FOR PEACE) -->
  <g transform="translate(0, 160)">
    <!-- Left Ribbon Fold -->
    <polygon points="12,18 42,4 42,32 12,46 24,32" fill="#ca8a04" stroke="#111827" stroke-width="2" stroke-linejoin="round" />
    <polygon points="42,18 42,32 54,24" fill="#854d0e" stroke="#111827" stroke-width="1.5" />

    <!-- Right Ribbon Fold -->
    <polygon points="228,18 198,4 198,32 228,46 216,32" fill="#ca8a04" stroke="#111827" stroke-width="2" stroke-linejoin="round" />
    <polygon points="198,18 198,32 186,24" fill="#854d0e" stroke="#111827" stroke-width="1.5" />

    <!-- Main Ribbon Center -->
    <path d="M 44,6 C 88,20 152,20 196,6 L 194,36 C 150,50 90,50 46,36 Z" 
          fill="#fef08a" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Ribbon Text: EDUCATION FOR PEACE -->
    <text x="120" y="27" font-family="'Arial Black', 'Inter', sans-serif" font-size="10.5" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1">
      EDUCATION FOR PEACE
    </text>
  </g>

  <!-- ESTD Text -->
  <text x="120" y="222" font-family="'Arial Black', 'Inter', sans-serif" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">
    (ESTD-1995)
  </text>
</svg>
