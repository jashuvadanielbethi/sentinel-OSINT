<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <path id="sparcTextArcTop" d="M 38,120 A 82,82 0 0,1 202,120" fill="none" />
    <path id="sparcTextArcBottom" d="M 202,120 A 82,82 0 0,1 38,120" fill="none" />
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer circular border -->
  <circle cx="120" cy="120" r="114" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <circle cx="120" cy="120" r="110" fill="#f8fafc" stroke="#111827" stroke-width="7" />
  <circle cx="120" cy="120" r="99" fill="none" stroke="#111827" stroke-width="2.5" />

  <!-- Outer text ring -->
  <text font-family="'Inter', 'Arial Black', sans-serif" font-size="7.6" font-weight="900" fill="#0f172a" letter-spacing="0.5">
    <textPath href="#sparcTextArcTop" startOffset="50%" text-anchor="middle">
      SCIENTIFIC PROGRAM FOR ACADEMIC RESEARCH CUBE
    </textPath>
  </text>
  <text font-family="'Inter', 'Arial Black', sans-serif" font-size="8.2" font-weight="900" fill="#0f172a" letter-spacing="0.8">
    <textPath href="#sparcTextArcBottom" startOffset="50%" text-anchor="middle">
      • AWARENESS • EDUCATION • SERVICE •
    </textPath>
  </text>

  <!-- Inner red dotted/dashed circle -->
  <circle cx="120" cy="120" r="74" fill="#ffffff" stroke="#dc2626" stroke-width="3" stroke-dasharray="2 3" />
  <circle cx="120" cy="120" r="69" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.4" />

  <!-- Radiating Starburst / Spark Behind Bulb -->
  <g fill="#111827">
    <polygon points="120,60 123,73 135,66 128,78 142,78 130,86 142,96 129,97 136,110 124,103 120,115 116,103 104,110 111,97 98,96 110,86 98,78 112,78 105,66 117,73" />
  </g>

  <!-- Light Bulb Core -->
  <g transform="translate(0, -2)">
    <!-- Bulb glass -->
    <path d="M 120,68 C 112,68 106,74 106,82 C 106,87 109,92 112,95 L 112,101 L 128,101 L 128,95 C 131,92 134,87 134,82 C 134,74 128,68 120,68 Z" fill="#ffffff" stroke="#111827" stroke-width="3" stroke-linejoin="round" />
    <!-- Filament lines -->
    <path d="M 116,84 L 118,76 L 122,76 L 124,84" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
    <!-- Bulb base/socket -->
    <rect x="114" y="101" width="12" height="3" rx="1.5" fill="#e2e8f0" stroke="#111827" stroke-width="1.8" />
    <rect x="115" y="104.5" width="10" height="3" rx="1.5" fill="#cbd5e1" stroke="#111827" stroke-width="1.8" />
    <path d="M 117,108.5 L 123,108.5 L 121,111 L 119,111 Z" fill="#111827" />
  </g>

  <!-- SPARC Main Typography -->
  <text x="120" y="137" font-family="'Cinzel', 'Rockwell', 'Georgia', 'Arial Black', serif" font-size="25" font-weight="900" fill="#111827" text-anchor="middle" letter-spacing="2.5">
    SPARC
  </text>
  <!-- Tiny decorative underline -->
  <line x1="94" y1="142" x2="146" y2="142" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
  <circle cx="120" cy="142" r="2.5" fill="#111827" />
</svg>
